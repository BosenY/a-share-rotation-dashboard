<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="缩量筑底轮动策略 · 持仓时间线与操作记录回测看板" />
  <title>缩量筑底轮动 · 持仓与操作</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <div class="brand-mark">轮</div>
        <div>
          <h1>缩量筑底轮动 · 持仓与操作</h1>
          <p>A-Share Rotation · Backtest Dashboard</p>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#overview" class="nav-link active">总览</a>
        <a href="#holdings" class="nav-link">持仓时间线</a>
        <a href="#trades" class="nav-link">操作记录</a>
        <a href="#strategy" class="nav-link">策略说明</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="overview">
      <div class="section-head">
        <div>
          <p class="section-kicker">Overview</p>
          <h2 class="section-title">策略总览</h2>
          <p id="one-liner" class="section-desc"></p>
        </div>
        <div id="period-badge" class="badge-pill"></div>
      </div>
      <div id="kpi-grid" class="kpi-grid"></div>
      <div class="overview-grid">
        <div class="card card-pad">
          <div class="chart-head">
            <h3>净值曲线 <span>NAV</span></h3>
            <span class="muted" id="nav-last"></span>
          </div>
          <div class="chart-box">
            <canvas id="equity-chart"></canvas>
          </div>
        </div>
        <div class="card card-pad snapshot">
          <h3>回测快照</h3>
          <dl id="snapshot-dl"></dl>
          <div class="shot-frame">
            <img src="assets/equity_curve.png" alt="Equity curve" loading="lazy" />
          </div>
        </div>
      </div>
    </section>

    <section id="holdings">
      <div class="section-head">
        <div>
          <p class="section-kicker">Holdings</p>
          <h2 class="section-title">持仓时间线</h2>
          <p class="section-desc">按调仓/交易日重建的仓位快照；高亮为最近一次非空持仓。</p>
        </div>
        <div class="filters">
          <label for="holdings-code-filter">筛选代码</label>
          <input id="holdings-code-filter" class="input w-28" type="text" placeholder="如 000617" />
          <label class="check">
            <input id="holdings-nonempty" type="checkbox" checked />
            仅看有持仓
          </label>
        </div>
      </div>
      <div id="holdings-latest" class="card card-pad latest-card"></div>
      <div id="holdings-list" class="holdings-list"></div>
    </section>

    <section id="trades">
      <div class="section-head">
        <div>
          <p class="section-kicker">Trades</p>
          <h2 class="section-title">操作记录</h2>
          <p class="section-desc">完整买卖流水，可按代码 / 方向 / 原因筛选。</p>
        </div>
        <div class="filters">
          <input id="trade-code" class="input w-24" type="text" placeholder="代码" />
          <select id="trade-side" class="select">
            <option value="">全部方向</option>
            <option value="buy">买入</option>
            <option value="sell">卖出</option>
          </select>
          <select id="trade-reason" class="select">
            <option value="">全部原因</option>
          </select>
        </div>
      </div>
      <div class="card table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>代码</th>
                <th>方向</th>
                <th class="right">价格</th>
                <th class="right">股数</th>
                <th class="right">金额</th>
                <th class="right">成本</th>
                <th>原因</th>
              </tr>
            </thead>
            <tbody id="trades-tbody"></tbody>
          </table>
        </div>
        <div id="trades-count" class="table-foot"></div>
      </div>
    </section>

    <section id="strategy">
      <div class="section-head">
        <div>
          <p class="section-kicker">Strategy</p>
          <h2 class="section-title">策略说明</h2>
        </div>
      </div>
      <div class="strategy-grid" id="strategy-cards"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>研究用途回测展示 · 非投资建议 · 数据由本地 CSV 生成</p>
    <p class="mono">a_share_rotation / web</p>
  </footer>

    <script src="assets/app.js"></script>
</body>
</html>
